connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=minioadmin
s3.aws-secret-key=CHANGE_ME_MINIO_SECRET

hive.non-managed-table-writes-enabled=true
# NOTE: hive.allow-drop-table=true was removed — it is not a valid property in
# Trino >= 455 and causes a crash-loop ("Configuration property ... was not used").
# Dropping tables is allowed by default in the Hive connector in modern Trino.
