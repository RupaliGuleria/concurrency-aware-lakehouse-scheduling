# Dummy realm so the JVM's Kerberos lookup doesn't crash on startup.
# This stack does not use Kerberos (no keytab/principal configured in
# metastore-site.xml, hadoop.security.authentication stays "simple") —
# Hadoop's UserGroupInformation still probes for a default realm during
# init regardless, and throws "Cannot locate default realm" if no
# krb5.conf exists at all. This file exists purely to satisfy that check.
[libdefaults]
    default_realm = EXAMPLE.COM
